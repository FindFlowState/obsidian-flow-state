name: Release Obsidian Plugin

on:
  push:
    # Version tags only. A bare "*" meant any tag — a scratch or backup tag —
    # published a public release to BRAT.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The release is named after the tag but BRAT reads the bundled
      # manifest, so a mismatch ships a release whose contents disagree with
      # its name. Fail before anything is built or published.
      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match manifest.json version $manifest"
            exit 1
          fi
          echo "tag and manifest agree on $tag"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A release used to publish whatever built, whether or not it worked.
      # These run before the build so a bad tag fails without publishing.
      - name: Test
        run: npm test

      - name: Build plugin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INGEST_EMAIL_DOMAIN: ${{ secrets.INGEST_EMAIL_DOMAIN }}
          SENTRY_DSN_OBSIDIAN: ${{ secrets.SENTRY_DSN_OBSIDIAN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # build.mjs reads .env.prod from resolve(projectRoot, '..', '..') where
          # projectRoot = scripts/.. = checkout root. So it looks at ../../.env.prod.
          mkdir -p ../../
          cat > ../../.env.prod <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          INGEST_EMAIL_DOMAIN=${INGEST_EMAIL_DOMAIN}
          SENTRY_DSN_OBSIDIAN=${SENTRY_DSN_OBSIDIAN}
          SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          ENV=prod
          EOF
          # Strip leading whitespace from env file (heredoc indentation)
          sed -i 's/^[[:space:]]*//' ../../.env.prod
          node scripts/build.mjs --mode=prod

      - name: Verify build output
        run: |
          test -f dist/prod/main.js || { echo "main.js not found"; exit 1; }
          test -f dist/prod/manifest.json || { echo "manifest.json not found"; exit 1; }
          test -f dist/prod/styles.css || { echo "styles.css not found"; exit 1; }

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/prod/main.js
            dist/prod/manifest.json
            dist/prod/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            dist/prod/main.js \
            dist/prod/manifest.json \
            dist/prod/styles.css \
            --title "$tag" \
            --generate-notes
